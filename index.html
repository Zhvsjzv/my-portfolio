<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zargham Chat</title>
  <!--
    ╔══════════════════════════════════════════════════╗
    ║  Zargham Chat  — v3.0  LAN Messenger             ║
    ║  All CSS/JS is self-contained (no CDN needed).   ║
    ║  Works 100% on a local network without internet. ║
    ╚══════════════════════════════════════════════════╝
  -->
  <style>
    /* ── Reset & Base ───────────────────────────────── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg:          #0d0d0d;
      --surface:     rgba(255,255,255,0.04);
      --glass:       rgba(255,255,255,0.07);
      --glass-hover: rgba(255,255,255,0.11);
      --border:      rgba(255,255,255,0.09);
      --neon:        #00ff88;
      --neon-dim:    rgba(0,255,136,0.15);
      --neon-glow:   0 0 18px rgba(0,255,136,0.45);
      --text:        #e8e8e8;
      --text-muted:  #777;
      --out-bubble:  rgba(0,255,136,0.12);
      --in-bubble:   rgba(255,255,255,0.06);
      --radius:      14px;
      --font:        'Segoe UI', system-ui, sans-serif;
    }

    html, body { height:100%; font-family:var(--font); background:var(--bg); color:var(--text); overflow:hidden; }

    /* ── Scrollbar ───────────────────────────────────── */
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(0,255,136,0.3); border-radius:99px; }

    /* ── Glassmorphism card ───────────────────────────── */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--border);
    }

    /* ══════════════════════════════════════════════════
       LOGIN SCREEN
    ══════════════════════════════════════════════════ */
    #loginScreen {
      position:fixed; inset:0; z-index:999;
      display:flex; align-items:center; justify-content:center;
      background: radial-gradient(ellipse at 30% 20%, rgba(0,255,136,0.07) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 80%, rgba(0,200,100,0.05) 0%, transparent 55%),
                  #0d0d0d;
    }

    .login-card {
      width:100%; max-width:420px; padding:48px 40px;
      border-radius:24px; text-align:center;
      background: rgba(15,15,15,0.85);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(0,255,136,0.2);
      box-shadow: 0 0 60px rgba(0,255,136,0.08), 0 30px 80px rgba(0,0,0,0.6);
      animation: fadeUp .5s ease;
    }

    @keyframes fadeUp {
      from { opacity:0; transform: translateY(28px); }
      to   { opacity:1; transform: translateY(0);    }
    }

    .login-logo {
      font-size:52px; font-weight:900; letter-spacing:-2px;
      background: linear-gradient(135deg, #00ff88, #00cc66);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      filter: drop-shadow(0 0 20px rgba(0,255,136,0.6));
      margin-bottom:6px;
    }

    .login-tagline { color:var(--text-muted); font-size:13px; margin-bottom:36px; letter-spacing:.5px; }

    .login-label { display:block; text-align:left; font-size:12px; color:var(--text-muted); margin-bottom:8px; letter-spacing:.8px; text-transform:uppercase; }

    #usernameInput {
      width:100%; padding:14px 18px; font-size:15px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius:10px; color:var(--text);
      outline:none; transition:.2s;
      font-family:var(--font);
    }
    #usernameInput::placeholder { color:#555; }
    #usernameInput:focus { border-color:var(--neon); box-shadow: var(--neon-glow); }

    /* Avatar colour picker */
    .color-row { display:flex; gap:10px; justify-content:center; margin:24px 0; }
    .color-swatch {
      width:32px; height:32px; border-radius:50%; cursor:pointer;
      border:3px solid transparent; transition:.15s;
    }
    .color-swatch.active,
    .color-swatch:hover { border-color:#fff; transform:scale(1.2); }

    .btn-join {
      width:100%; padding:14px; font-size:15px; font-weight:600;
      background: linear-gradient(135deg, #00ff88, #00cc66);
      color:#0d0d0d; border:none; border-radius:10px; cursor:pointer;
      letter-spacing:.4px; transition:.2s;
      font-family:var(--font);
    }
    .btn-join:hover { filter:brightness(1.1); box-shadow:var(--neon-glow); }
    .btn-join:disabled { opacity:.5; cursor:not-allowed; }

    /* ══════════════════════════════════════════════════
       APP LAYOUT
    ══════════════════════════════════════════════════ */
    #app { display:none; height:100vh; }
    #app.show { display:flex; }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width:260px; flex-shrink:0;
      display:flex; flex-direction:column;
      background: rgba(10,10,10,0.7);
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      padding:20px 18px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size:18px; font-weight:700; color:var(--neon);
      letter-spacing:-.3px;
      text-shadow: 0 0 12px rgba(0,255,136,0.5);
    }
    .sidebar-sub { font-size:12px; color:var(--text-muted); margin-top:2px; }

    .online-label {
      padding:14px 18px 8px;
      font-size:11px; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.8px;
    }

    .user-list { flex:1; overflow-y:auto; padding:0 10px 10px; }

    .user-item {
      display:flex; align-items:center; gap:10px;
      padding:9px 10px; border-radius:10px; margin-bottom:2px;
      transition:.15s;
    }
    .user-item:hover { background:var(--glass-hover); }

    .user-dot {
      width:32px; height:32px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:13px; font-weight:700; color:#0d0d0d;
    }
    .user-name { font-size:14px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .badge-you { font-size:10px; color:var(--text-muted); margin-left:4px; }

    .online-dot {
      width:8px; height:8px; border-radius:50%;
      background:var(--neon); margin-left:auto; flex-shrink:0;
      box-shadow: 0 0 6px var(--neon);
    }

    .sidebar-footer {
      padding:14px 18px;
      border-top:1px solid var(--border);
      font-size:12px; color:var(--text-muted);
    }
    .my-name { color:var(--text); font-weight:600; font-size:13px; }

    /* ── Chat Area ───────────────────────────────────── */
    .chat-area {
      flex:1; display:flex; flex-direction:column;
      min-width:0;
      background: radial-gradient(ellipse at top left, rgba(0,255,136,0.03) 0%, transparent 60%), #0d0d0d;
    }

    /* Chat Header */
    .chat-header {
      padding:14px 22px;
      display:flex; align-items:center; gap:14px;
      background: rgba(10,10,10,0.6);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .chat-header-icon {
      width:38px; height:38px; border-radius:50%;
      background: linear-gradient(135deg,#00ff88,#00aa55);
      display:flex; align-items:center; justify-content:center;
      font-size:16px; color:#0d0d0d; font-weight:800;
      box-shadow:var(--neon-glow);
    }
    .chat-header-info .room-name { font-size:15px; font-weight:600; color:var(--text); }
    .chat-header-info .room-sub  { font-size:12px; color:var(--text-muted); }
    .header-right { margin-left:auto; display:flex; gap:10px; align-items:center; }
    .online-count {
      font-size:12px; color:var(--neon);
      background:var(--neon-dim); padding:4px 10px;
      border-radius:20px; font-weight:600;
    }

    /* Messages */
    #msgList {
      flex:1; overflow-y:auto; padding:20px 22px;
      display:flex; flex-direction:column; gap:4px;
    }

    .sys-msg {
      text-align:center; font-size:12px; color:var(--text-muted);
      padding:6px 0; margin:4px 0;
    }
    .sys-msg span {
      background:rgba(255,255,255,0.05);
      padding:4px 12px; border-radius:20px;
    }

    /* Message row */
    .msg-row { display:flex; gap:10px; align-items:flex-end; max-width:100%; }
    .msg-row.out { flex-direction:row-reverse; }

    .msg-avatar {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700; color:#0d0d0d;
    }

    .msg-bubble-wrap { display:flex; flex-direction:column; max-width:62%; }
    .msg-row.out .msg-bubble-wrap { align-items:flex-end; }

    .msg-name { font-size:11px; font-weight:600; margin-bottom:3px; padding-left:2px; }

    .msg-bubble {
      padding:10px 14px; border-radius:14px; font-size:14px;
      line-height:1.5; word-break:break-word;
      position:relative;
    }
    .msg-row.in  .msg-bubble { background:var(--in-bubble);  border-radius:4px 14px 14px 14px; }
    .msg-row.out .msg-bubble { background:var(--out-bubble); border-radius:14px 4px 14px 14px; border:1px solid rgba(0,255,136,0.22); }

    .msg-meta { font-size:11px; color:var(--text-muted); margin-top:4px; padding:0 2px; }
    .msg-row.out .msg-meta { text-align:right; }

    /* File attachment inside bubble */
    .file-attach { margin-top:4px; }
    .file-attach a {
      display:inline-flex; align-items:center; gap:8px;
      background:rgba(255,255,255,0.08); border-radius:8px;
      padding:8px 12px; color:var(--neon); text-decoration:none;
      font-size:13px; transition:.15s;
    }
    .file-attach a:hover { background:rgba(0,255,136,0.12); }
    .file-attach img {
      max-width:240px; max-height:200px; border-radius:10px;
      margin-top:8px; display:block; cursor:pointer;
    }

    /* Typing indicator */
    #typingBar {
      min-height:24px; padding:0 22px 6px;
      font-size:12px; color:var(--text-muted);
      display:flex; align-items:center; gap:6px; transition:.2s;
    }
    .typing-dots { display:flex; gap:3px; align-items:center; }
    .typing-dots span {
      width:5px; height:5px; border-radius:50%;
      background:var(--neon); animation:dot .9s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay:.15s; }
    .typing-dots span:nth-child(3) { animation-delay:.30s; }
    @keyframes dot {
      0%,80%,100% { transform:scale(.8); opacity:.5; }
      40%         { transform:scale(1.2); opacity:1;  }
    }

    /* ── Input Bar ───────────────────────────────────── */
    .input-bar {
      padding:14px 18px;
      display:flex; align-items:flex-end; gap:10px;
      background: rgba(10,10,10,0.6);
      border-top: 1px solid var(--border);
    }

    .attach-btn {
      width:42px; height:42px; border-radius:10px; border:none; cursor:pointer;
      background:var(--glass); color:var(--text-muted);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0; transition:.15s;
    }
    .attach-btn:hover { background:var(--neon-dim); color:var(--neon); }

    #msgInput {
      flex:1; min-height:42px; max-height:130px; resize:none;
      padding:11px 16px; font-size:14px;
      background:rgba(255,255,255,0.05);
      border:1px solid var(--border);
      border-radius:10px; color:var(--text); outline:none;
      transition:.2s; line-height:1.5;
      font-family:var(--font);
      overflow-y:auto;
    }
    #msgInput::placeholder { color:#555; }
    #msgInput:focus { border-color:rgba(0,255,136,0.4); box-shadow:0 0 0 2px rgba(0,255,136,0.08); }

    .send-btn {
      width:42px; height:42px; border-radius:10px; border:none; cursor:pointer;
      background: linear-gradient(135deg,#00ff88,#00cc66);
      color:#0d0d0d; font-size:18px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      transition:.15s;
    }
    .send-btn:hover { filter:brightness(1.12); box-shadow:var(--neon-glow); }
    .send-btn:disabled { opacity:.4; cursor:not-allowed; filter:none; box-shadow:none; }

    /* Hidden file input */
    #fileInput { display:none; }

    /* File preview pill */
    .file-preview {
      display:none; align-items:center; gap:10px;
      padding:8px 14px; margin:0 18px 4px;
      background:var(--neon-dim); border:1px solid rgba(0,255,136,0.3);
      border-radius:10px; font-size:13px; color:var(--neon);
    }
    .file-preview.show { display:flex; }
    .file-preview .fp-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .fp-cancel {
      cursor:pointer; color:var(--text-muted); font-size:16px;
      background:none; border:none; color:var(--neon); line-height:1;
    }

    /* ══════════════════════════════════════════════════
       RESPONSIVE — Mobile
    ══════════════════════════════════════════════════ */
    @media (max-width: 680px) {
      .sidebar { display:none; }
      .sidebar.mob-open { display:flex; position:fixed; inset:0; z-index:50; width:100%; max-width:280px; }
      .chat-header { padding:12px 14px; }
      #msgList { padding:14px; }
      .input-bar { padding:10px 12px; }
      .mob-menu-btn { display:flex !important; }
      .msg-bubble-wrap { max-width:80%; }
    }

    .mob-menu-btn {
      display:none; width:34px; height:34px; border-radius:8px;
      border:none; background:var(--glass); color:var(--text-muted);
      cursor:pointer; margin-right:4px;
      align-items:center; justify-content:center; font-size:18px;
    }

    /* ── Toast notification ────────────────────────── */
    #toast {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
      background:rgba(0,255,136,0.12); border:1px solid rgba(0,255,136,0.35);
      color:var(--neon); padding:10px 22px; border-radius:30px;
      font-size:13px; opacity:0; transition:.3s; pointer-events:none; z-index:9999;
      white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════════════════════ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Z</div>
    <div class="login-tagline">Zargham Chat &mdash; LAN Messenger</div>

    <label class="login-label" for="usernameInput">Your display name</label>
    <input id="usernameInput" type="text" placeholder="Enter your name..." maxlength="24" autocomplete="off" />

    <div class="online-label" style="padding:18px 0 8px;text-align:left;font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.8px;">Pick a colour</div>
    <div class="color-row" id="colorRow"></div>

    <button class="btn-join" id="joinBtn" onclick="joinChat()" disabled>Join Chat</button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     MAIN APP
══════════════════════════════════════════════════ -->
<div id="app">

  <!-- Sidebar: online users -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Zargham Chat</div>
      <div class="sidebar-sub">Local Network Messenger</div>
    </div>
    <div class="online-label">Online</div>
    <div class="user-list" id="userList"></div>
    <div class="sidebar-footer">
      Logged in as <span class="my-name" id="myNameLabel"></span>
    </div>
  </aside>

  <!-- Chat area -->
  <main class="chat-area">

    <!-- Header -->
    <div class="chat-header">
      <button class="mob-menu-btn" id="mobMenuBtn" onclick="toggleSidebar()">&#9776;</button>
      <div class="chat-header-icon">Z</div>
      <div class="chat-header-info">
        <div class="room-name">General Room</div>
        <div class="room-sub" id="roomSub">Connecting&hellip;</div>
      </div>
      <div class="header-right">
        <span class="online-count" id="onlineCount">0 online</span>
      </div>
    </div>

    <!-- Messages -->
    <div id="msgList"></div>

    <!-- Typing indicator -->
    <div id="typingBar"></div>

    <!-- File preview pill -->
    <div class="file-preview" id="filePreview">
      <span>&#128206;</span>
      <span class="fp-name" id="fpName"></span>
      <button class="fp-cancel" onclick="clearFile()">&#10005;</button>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">&#128206;</button>
      <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.zip" onchange="onFileChosen(event)" />
      <textarea id="msgInput" rows="1" placeholder="Type a message&hellip;" onkeydown="onKey(event)" oninput="onType()"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>&#10148;</button>
    </div>

  </main>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ══════════════════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════════════════ -->
<script>
// ─────────────────────────────────────────────────────────────
//  Config
// ─────────────────────────────────────────────────────────────
// Palette users can pick as their accent colour
const COLORS = [
  "#00ff88","#00ccff","#ff6b6b","#ffcc00","#bb86fc","#ff9144","#ff4da6","#44ddff"
];

// How many milliseconds of silence before "stop_typing" fires
const TYPING_TIMEOUT_MS = 2000;

// ─────────────────────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────────────────────
let ws            = null;     // active WebSocket
let me            = null;     // { id, username, color }
let selectedColor = COLORS[0];
let pendingFile   = null;     // File object chosen but not yet sent
let typingTimer   = null;     // debounce handle
let isTyping      = false;    // are WE currently sending typing events?
let typingUsers   = {};       // { uid: { username, color, timer } }

// ─────────────────────────────────────────────────────────────
//  Build colour swatches on load
// ─────────────────────────────────────────────────────────────
(function buildSwatches() {
  const row = document.getElementById("colorRow");
  COLORS.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "color-swatch" + (i === 0 ? " active" : "");
    el.style.background = c;
    el.title = c;
    el.onclick = () => {
      document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
      el.classList.add("active");
      selectedColor = c;
    };
    row.appendChild(el);
  });
})();

// Enable join button only when name has content
document.getElementById("usernameInput").addEventListener("input", e => {
  document.getElementById("joinBtn").disabled = e.target.value.trim().length < 2;
});

// Allow pressing ENTER on the name field to join
document.getElementById("usernameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") joinChat();
});

// ─────────────────────────────────────────────────────────────
//  joinChat()  —  called when the user clicks "Join Chat"
// ─────────────────────────────────────────────────────────────
function joinChat() {
  const name = document.getElementById("usernameInput").value.trim();
  if (name.length < 2) return;

  // Build our identity
  me = {
    id:       crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2),
    username: name,
    color:    selectedColor,
  };

  // Hide login, show app
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").classList.add("show");
  document.getElementById("myNameLabel").textContent = me.username;

  connectWS();
}

// ─────────────────────────────────────────────────────────────
//  WebSocket connection
// ─────────────────────────────────────────────────────────────
function connectWS() {
  const host = location.host;  // works for any LAN IP automatically
  const url  = `ws://${host}/ws/${me.id}?username=${enc(me.username)}&color=${enc(me.color)}`;

  ws = new WebSocket(url);

  ws.onopen = () => {
    setRoomSub("Connected");
    document.getElementById("sendBtn").disabled = false;
    console.log("[WS] connected");
  };

  ws.onmessage = e => handleMsg(JSON.parse(e.data));

  ws.onerror = () => setRoomSub("Connection error");

  ws.onclose = () => {
    setRoomSub("Disconnected — retrying in 4s");
    document.getElementById("sendBtn").disabled = true;
    setTimeout(connectWS, 4000);  // auto-reconnect
  };
}

// ─────────────────────────────────────────────────────────────
//  Handle incoming WebSocket messages
// ─────────────────────────────────────────────────────────────
function handleMsg(data) {

  switch (data.type) {

    case "welcome":
      // Server confirmed our identity (already set client-side, just log)
      break;

    case "history":
      // Replay past messages for the new joiner
      (data.messages || []).forEach(m => renderMsg(m));
      scrollBottom();
      break;

    case "message":
      renderMsg(data);
      stopRemoteTyping(data.user_id);   // typing stops when message arrives
      scrollBottom();
      break;

    case "file_message":
      renderFileMsg(data);
      scrollBottom();
      break;

    case "user_joined":
      updateOnlinePanel(data.online_users || []);
      appendSys(`${data.username} joined the chat`);
      setOnlineCount(data.online_users || []);
      break;

    case "user_left":
      updateOnlinePanel(data.online_users || []);
      appendSys(`${data.username} left the chat`);
      setOnlineCount(data.online_users || []);
      stopRemoteTyping(data.user_id);
      break;

    case "typing":
      showRemoteTyping(data.user_id, data.username, data.color);
      break;

    case "stop_typing":
      stopRemoteTyping(data.user_id);
      break;
  }
}

// ─────────────────────────────────────────────────────────────
//  Render a regular text message
// ─────────────────────────────────────────────────────────────
function renderMsg(data) {
  const isOut = data.user_id === me.id;
  const row   = document.createElement("div");
  row.className = "msg-row " + (isOut ? "out" : "in");
  row.innerHTML = `
    <div class="msg-avatar" style="background:${esc(data.color || "#555")}">
      ${esc((data.username || "?")[0].toUpperCase())}
    </div>
    <div class="msg-bubble-wrap">
      ${isOut ? "" : `<div class="msg-name" style="color:${esc(data.color || "#aaa")}">${esc(data.username)}</div>`}
      <div class="msg-bubble">${linkify(esc(data.text || ""))}</div>
      <div class="msg-meta">${esc(data.timestamp || "")}</div>
    </div>`;
  document.getElementById("msgList").appendChild(row);
}

// ─────────────────────────────────────────────────────────────
//  Render a file-share message
// ─────────────────────────────────────────────────────────────
function renderFileMsg(data) {
  const isOut  = data.user_id === me.id;
  const isImg  = data.is_image;
  const row    = document.createElement("div");
  row.className = "msg-row " + (isOut ? "out" : "in");

  const fileContent = isImg
    ? `<img src="${esc(data.url)}" alt="${esc(data.original_name)}" onclick="window.open(this.src)">`
    : `<a href="${esc(data.url)}" target="_blank" download>&#128206; ${esc(data.original_name)}</a>`;

  row.innerHTML = `
    <div class="msg-avatar" style="background:${esc(data.color || "#555")}">
      ${esc((data.username || "?")[0].toUpperCase())}
    </div>
    <div class="msg-bubble-wrap">
      ${isOut ? "" : `<div class="msg-name" style="color:${esc(data.color || "#aaa")}">${esc(data.username)}</div>`}
      <div class="msg-bubble">
        <div class="file-attach">${fileContent}</div>
      </div>
      <div class="msg-meta">${esc(data.timestamp || "")}</div>
    </div>`;
  document.getElementById("msgList").appendChild(row);
}

// ─────────────────────────────────────────────────────────────
//  System message (join/leave)
// ─────────────────────────────────────────────────────────────
function appendSys(text) {
  const el = document.createElement("div");
  el.className = "sys-msg";
  el.innerHTML = `<span>${esc(text)}</span>`;
  document.getElementById("msgList").appendChild(el);
  scrollBottom();
}

// ─────────────────────────────────────────────────────────────
//  Auto-scroll to latest message
// ─────────────────────────────────────────────────────────────
function scrollBottom() {
  const list = document.getElementById("msgList");
  // requestAnimationFrame ensures the DOM has been painted first
  requestAnimationFrame(() => {
    list.scrollTop = list.scrollHeight;
  });
}

// ─────────────────────────────────────────────────────────────
//  Send a text message
// ─────────────────────────────────────────────────────────────
function sendMessage() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  // If a file is pending, send that first
  if (pendingFile) { uploadAndSend(); return; }

  const text = document.getElementById("msgInput").value.trim();
  if (!text) return;

  stopTypingSignal();  // clear typing indicator

  ws.send(JSON.stringify({ type: "message", text }));

  document.getElementById("msgInput").value = "";
  autoResize();
}

// ─────────────────────────────────────────────────────────────
//  Keyboard handler for the textarea
// ─────────────────────────────────────────────────────────────
function onKey(e) {
  // ENTER (without Shift) sends the message
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ─────────────────────────────────────────────────────────────
//  Typing indicators
// ─────────────────────────────────────────────────────────────
function onType() {
  autoResize();  // grow textarea

  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  // Send "typing" event if we are not already marked as typing
  if (!isTyping) {
    isTyping = true;
    ws.send(JSON.stringify({ type: "typing" }));
  }

  // Reset the debounce timer on every keystroke
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTypingSignal, TYPING_TIMEOUT_MS);
}

function stopTypingSignal() {
  if (isTyping && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "stop_typing" }));
  }
  isTyping = false;
  clearTimeout(typingTimer);
}

// Show another user's typing indicator
function showRemoteTyping(uid, username, color) {
  // Clear any expiry timer for this user
  if (typingUsers[uid]) clearTimeout(typingUsers[uid].timer);

  // Auto-remove after 3 seconds of no update
  const timer = setTimeout(() => stopRemoteTyping(uid), 3000);
  typingUsers[uid] = { username, color, timer };
  renderTypingBar();
}

function stopRemoteTyping(uid) {
  if (typingUsers[uid]) {
    clearTimeout(typingUsers[uid].timer);
    delete typingUsers[uid];
    renderTypingBar();
  }
}

function renderTypingBar() {
  const bar   = document.getElementById("typingBar");
  const names = Object.values(typingUsers);
  if (names.length === 0) { bar.innerHTML = ""; return; }

  const label = names.length === 1
    ? `<span style="color:${esc(names[0].color)}">${esc(names[0].username)}</span> is typing`
    : `${names.length} people are typing`;

  bar.innerHTML = `
    <div class="typing-dots"><span></span><span></span><span></span></div>
    <span>${label}</span>`;
}

// ─────────────────────────────────────────────────────────────
//  File attachment
// ─────────────────────────────────────────────────────────────
function onFileChosen(e) {
  const file = e.target.files[0];
  if (!file) return;
  pendingFile = file;
  document.getElementById("fpName").textContent = file.name;
  document.getElementById("filePreview").classList.add("show");
  document.getElementById("sendBtn").disabled = false;
}

function clearFile() {
  pendingFile = null;
  document.getElementById("fileInput").value = "";
  document.getElementById("filePreview").classList.remove("show");
}

async function uploadAndSend() {
  if (!pendingFile || !ws) return;

  const file = pendingFile;
  clearFile();
  showToast("Uploading " + file.name + "…");

  try {
    const form = new FormData();
    form.append("file", file);

    const res  = await fetch("/upload", { method: "POST", body: form });
    const data = await res.json();

    if (!data.ok) { showToast("Upload failed: " + data.error); return; }

    // Send a file_message event over WebSocket so all users get it
    ws.send(JSON.stringify({
      type:          "file_message",
      url:           data.url,
      original_name: data.name,
      size:          data.size,
      is_image:      data.is_image,
    }));

    showToast("Sent " + data.name);

  } catch (err) {
    showToast("Upload error: " + err.message);
  }
}

// ─────────────────────────────────────────────────────────────
//  Online users panel
// ─────────────────────────────────────────────────────────────
function updateOnlinePanel(users) {
  const list = document.getElementById("userList");
  list.innerHTML = "";
  users.forEach(u => {
    const item = document.createElement("div");
    item.className = "user-item";
    const badge = u.id === me.id ? `<span class="badge-you">(you)</span>` : "";
    item.innerHTML = `
      <div class="user-dot" style="background:${esc(u.color)}">${esc(u.username[0].toUpperCase())}</div>
      <span class="user-name">${esc(u.username)}${badge}</span>
      <div class="online-dot"></div>`;
    list.appendChild(item);
  });
}

function setOnlineCount(users) {
  document.getElementById("onlineCount").textContent = users.length + " online";
}

// ─────────────────────────────────────────────────────────────
//  UI helpers
// ─────────────────────────────────────────────────────────────
function setRoomSub(text) {
  document.getElementById("roomSub").textContent = text;
}

function autoResize() {
  const ta = document.getElementById("msgInput");
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 130) + "px";
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("mob-open");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

// Safety HTML-escape to prevent XSS
function esc(str) {
  return String(str ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function enc(str) { return encodeURIComponent(str); }

// Convert plain URLs in text to clickable links
function linkify(text) {
  return text.replace(/(https?:\/\/[^\s]+)/g, (url) =>
    `<a href="${url}" target="_blank" style="color:var(--neon)">${url}</a>`
  );
}
</script>
